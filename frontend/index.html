<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LATZ is an AI engineering workspace for building, learning, researching and experimenting." />
    <meta name="theme-color" content="#04070d" />
    <title>LATZ — AI Engineering Lab</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        if (localStorage.getItem("latz-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (error) {
        // Storage unavailable: keep the default dark theme.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
